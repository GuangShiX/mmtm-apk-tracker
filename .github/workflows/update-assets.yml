name: Update game assets

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mementomori-asset-update
  cancel-in-progress: false

jobs:
  update:
    if: ${{ vars.OSS_BUCKET != '' }}
    runs-on: ${{ vars.ASSET_RUNNER || 'windows-latest' }}
    timeout-minutes: 350
    env:
      MMTM_OSS_ENABLED: "true"
      MMTM_OSS_SKIP_IF_PUBLISHED: "true"
      OSS_ENDPOINT: "https://oss-cn-beijing.aliyuncs.com"
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
      OSS_PREFIX: ${{ vars.OSS_PREFIX || 'mementomori' }}
      CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pinned apkeep
        shell: pwsh
        run: |
          $url = "https://github.com/EFForg/apkeep/releases/download/1.0.0/apkeep-x86_64-pc-windows-msvc.exe"
          $expected = "9E321BAB9FCC6BAB6F6A779AE21D3611DFE6BF3BBECC13FFC9E57AA2DB044E7F"
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri $url -OutFile bin/apkeep.exe
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath bin/apkeep.exe).Hash
          if ($actual -ne $expected) {
            throw "apkeep checksum mismatch: $actual"
          }

      - name: Validate OSS variables
        shell: pwsh
        run: |
          foreach ($name in @("OSS_BUCKET", "OSS_ACCESS_KEY_ID", "OSS_ACCESS_KEY_SECRET")) {
            if (-not (Get-Item "Env:$name").Value) {
              throw "Missing GitHub Actions setting: $name"
            }
          }

      - name: Detect, extract, and publish update
        run: python run.py

      - name: Show remaining disk space
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem
