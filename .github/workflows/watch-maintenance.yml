name: Watch official maintenance and new character data

on:
  schedule:
    # Discover announced windows before they start; polling happens in one job.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mementomori-cloud-maintenance-watch
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_watch: ${{ steps.plan.outputs.should_watch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install lightweight probe dependencies
        run: python -m pip install msgpack==1.1.2 requests==2.32.5 Pillow==11.3.0
      - name: Verify watcher and its production imports
        run: |
          python -B -m unittest discover -s tests -p 'test_cloud_update_watch.py' -v
          python -B -m unittest discover -s tests -p 'test_cloud_verify_cards.py' -v
          python -B -c "import cloud_update_watch, asset_cdn, master, maintenance"
      - name: Read official maintenance announcements
        id: plan
        run: python -B cloud_update_watch.py --plan --github-output "$GITHUB_OUTPUT"

  skills:
    needs: plan
    if: needs.plan.outputs.should_watch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    outputs:
      exported: ${{ steps.watch.outputs.exported }}
      has_new_characters: ${{ steps.watch.outputs.has_new_characters }}
      new_character_ids: ${{ steps.watch.outputs.new_character_ids }}
      has_preview_characters: ${{ steps.watch.outputs.has_preview_characters }}
      preview_character_ids: ${{ steps.watch.outputs.preview_character_ids }}
    steps:
      - uses: actions/checkout@v6
      - name: Check out published character baseline
        uses: actions/checkout@v6
        with:
          repository: GuangShiX/mmtm-assets-fallback
          path: _baseline
          sparse-checkout: skills
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install lightweight skill dependencies
        run: python -m pip install msgpack==1.1.2 requests==2.32.5 Pillow==11.3.0
      - name: Restore last verified data and baseline
        uses: actions/cache/restore@v4
        with:
          path: |
            reports/cloud-update/state.json
            reports/cloud-update/export/
          key: cloud-maintenance-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cloud-maintenance-v1-
      - name: Watch versions and export skills before image work
        id: watch
        run: >-
          python -B cloud_update_watch.py --watch
          --interval-seconds 20
          --max-duration-seconds 19800
          --refresh-window-seconds 300
          --baseline-skills-dir _baseline/skills
          --output reports/cloud-update/export
          --state-file reports/cloud-update/state.json
          --raw-dir "${{ runner.temp }}/mmtm-private-master"
          --github-output "$GITHUB_OUTPUT"
          --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Deliver derived skill information immediately
        id: skill_artifact
        if: steps.watch.outputs.exported == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: character-skills-${{ github.run_id }}
          path: |
            reports/cloud-update/export/skills/
            reports/cloud-update/export/preview/skills/
            reports/cloud-update/export/brief.md
          if-no-files-found: error
          retention-days: 14
      - name: Save verified baseline for the next cloud run
        if: always() && (steps.watch.outputs.exported != 'true' || steps.skill_artifact.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: |
            reports/cloud-update/state.json
            reports/cloud-update/export/
          key: cloud-maintenance-v1-${{ github.run_id }}-${{ github.run_attempt }}

  poster:
    needs: skills
    if: needs.skills.outputs.exported == 'true' && (needs.skills.outputs.has_new_characters == 'true' || needs.skills.outputs.has_preview_characters == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHARACTER_IDS: ${{ needs.skills.outputs.new_character_ids }}
      PREVIEW_IDS: ${{ needs.skills.outputs.preview_character_ids }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: character-skills-${{ github.run_id }}
          path: reports/cloud-poster/input
      - name: Install renderer dependencies and fonts
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Render only confirmed new characters with the maintained template
        shell: bash
        run: |
          render_set() {
            local list="$1" source="$2" destination="$3"
            [ -n "$list" ] || return 0
            IFS=',' read -r -a ids <<< "$list"
            for id in "${ids[@]}"; do
              [[ "$id" =~ ^[0-9]+$ ]] || { echo 'Invalid CharacterId'; exit 1; }
              python -B skill_card.py --character-id "$id" \
                --skills-dir "$source" --output-dir "$destination/characters" \
                --cache-dir "${{ runner.temp }}/mmtm-poster-cache" \
                --mode split --language zh-CN
            done
            python -B cloud_verify_cards.py --character-ids "$list" \
              --skills-dir "$source" --output-dir "$destination/characters" \
              --language zh-CN
          }
          render_set "$CHARACTER_IDS" reports/cloud-poster/input/skills reports/cloud-poster/cards/released
          render_set "$PREVIEW_IDS" reports/cloud-poster/input/preview/skills reports/cloud-poster/cards/preview
      - name: Deliver poster candidates for asset and visual review
        uses: actions/upload-artifact@v4
        with:
          name: character-poster-candidates-${{ github.run_id }}
          path: reports/cloud-poster/cards/
          if-no-files-found: error
          retention-days: 14
