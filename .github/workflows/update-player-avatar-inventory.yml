name: Update player avatar inventory

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mementomori-player-avatar-inventory
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tracker
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Sync complete player avatar inventory
        run: python asset_requests.py sync-player-avatar-inventory --auto-update

      - name: Verify tracker
        run: python -m unittest discover -s tests -v

      - name: Commit inventory changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/player_avatar_inventory.json
          if git diff --cached --quiet; then
            echo "Player avatar inventory is current."
            exit 0
          fi
          master_version="$(python -c 'import json; print(json.load(open("config/player_avatar_inventory.json", encoding="utf-8"))["master_version"])')"
          git commit -m "Update player avatar inventory for ${master_version}"
          git push origin master
